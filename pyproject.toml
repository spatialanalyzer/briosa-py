[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "briosa-client"
version = "0.1.0"
description = "Thin asynchronous Python client for the Briosa SpatialAnalyzer bridge"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "SpatialAnalyzer contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Typing :: Typed",
]
dependencies = [
  "grpcio>=1.74.0,<2",
  "protobuf>=6.31.1,<7",
]

[project.optional-dependencies]
dev = [
  "build==1.2.2.post1",
  "grpcio-tools==1.74.0",
  "grpc-stubs==1.53.0.6",
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.7",
  "types-protobuf==6.32.1.20260221",
]

[project.urls]
Homepage = "https://github.com/spatialanalyzer/briosa-py"
Issues = "https://github.com/spatialanalyzer/briosa-py/issues"
Source = "https://github.com/spatialanalyzer/briosa-py"

[tool.hatch.build.targets.wheel]
packages = ["src/briosa"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/tools",
  "/eng",
  "/README.md",
  "/LICENSE",
  "/protocol.lock.json",
  "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = [
  "src/briosa/*_pb2.py",
  "src/briosa/*_pb2.pyi",
  "src/briosa/*_pb2_grpc.py",
  "src/briosa/protocol_identity.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/briosa", "tests", "tools", "eng/import_protocol_artifact.py"]
exclude = ["^src/briosa/(?:.*_pb2(?:_grpc)?\\.py|.*_pb2\\.pyi)$"]
